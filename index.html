<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Каталог товарів</title>
<style>
body { font-family: Arial; background:#f2f2f2; margin:20px; }
header, main { max-width:900px; margin:auto; }
nav { background:#333; padding:15px; }
nav a { color:white; margin-right:20px; text-decoration:none; }
.category, .product { background:white; padding:15px; margin:10px; display:inline-block; vertical-align:top; width:180px; }
.product img { width:150px; height:150px; }
.price { color:darkblue; font-weight:bold; }
</style>
</head>
<body>
<header>
<h1>Мій каталог товарів</h1>
<nav>
<a href="index.html">Додому</a>
<a href="#" id="catalog">Каталог</a>
</nav>
</header>
<main><div id="content"></div></main>
<script>
var content = document.getElementById("content");

// Завантаження списку категорій
function showCatalog() {
    fetch("data/categories.json")
        .then(function(response) { return response.json(); })
        .then(function(categories) {
            var html = "<h2>Категорії</h2>";

            categories.forEach(function(category) {
                html += '<div class="category">';
                html += '<a href="#" class="categoryLink" data-name="' +
                    category.shortname + '">' + category.name + '</a>';
                html += "<p>" + category.notes + "</p></div>";
            });

            html += '<p><a href="#" id="special">Specials</a></p>';
            content.innerHTML = html;

            var links = document.getElementsByClassName("categoryLink");
            for (var i = 0; i < links.length; i++) {
                links[i].onclick = function(event) {
                    event.preventDefault();
                    showCategory(this.getAttribute("data-name"));
                };
            }

            document.getElementById("special").onclick = function(event) {
                event.preventDefault();
                var random = Math.floor(Math.random() * categories.length);
                showCategory(categories[random].shortname);
            };
        })
        .catch(function(error) {
            content.innerHTML = "Помилка завантаження каталогу.";
            console.log(error);
        });
}

// Завантаження товарів вибраної категорії
function showCategory(name) {
    fetch("data/" + name + ".json")
        .then(function(response) { return response.json(); })
        .then(function(category) {
            var html = "<h2>" + category.categoryName + "</h2>";

            category.products.forEach(function(product) {
                html += '<div class="product">';
                html += '<img src="' + product.image + '" alt="' + product.name + '">';
                html += "<h3>" + product.name + "</h3>";
                html += "<p>" + product.description + "</p>";
                html += '<p class="price">' + product.price + " грн</p>";
                html += "</div>";
            });

            content.innerHTML = html;
        })
        .catch(function(error) {
            content.innerHTML = "Помилка завантаження товарів.";
            console.log(error);
        });
}

document.getElementById("catalog").onclick = function(event) {
    event.preventDefault();
    showCatalog();
};

showCatalog();
</script>
</body>
</html>
